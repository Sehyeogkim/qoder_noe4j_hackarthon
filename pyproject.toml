[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arma-memory"
version = "0.1.0"
description = "Evidence-backed external memory for a frozen robot policy"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "google-genai>=1.0,<2", "neo4j>=5.26,<7", "httpx>=0.27,<1", "python-dotenv>=1,<2", "Pillow>=10,<12", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
arma = "arma.cli:main"

[tool.setuptools.packages.find]
include = ["arma*"]

[tool.setuptools.package-data]
arma = ["migrations/*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
